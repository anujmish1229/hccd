<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hindu Community Centre of Durham</title>
    <meta name="description" content="Hindu Community Centre of Durham" />
    <meta name="author" content="Hindu Community Centre of Durham" />

    <meta property="og:title" content="Hindu Community Centre of Durham" />
    <meta property="og:description" content="Hindu Community Centre of Durham" />
    <meta property="og:type" content="website" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Netlify Forms: static declarations required for build-time detection in SPAs -->
    <form name="hccd-contact" netlify netlify-honeypot="bot-field" hidden>
      <input name="name" />
      <input name="contact" />
      <textarea name="message"></textarea>
    </form>
    <form name="hccd-join" netlify netlify-honeypot="bot-field" hidden>
      <input name="fullName" />
      <input name="email" />
      <input name="phone" />
      <textarea name="about"></textarea>
    </form>
  </body>
</html>
